<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders — Smart Canteen Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body data-layout="admin" data-page="orders">
  <div id="adminSidebarMount"></div>

  <div class="admin-main">
    <div id="adminTopbarMount"></div>

    <main class="admin-content">
      <!-- Filters -->
      <div class="card-panel mb-4">
        <div class="card-body-p">
          <div class="row g-3 align-items-end">
            <div class="col-sm-6 col-lg-3">
              <label class="form-label small text-secondary mb-1">Status</label>
              <select id="filterStatus" class="form-select">
                <option value="">All statuses</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="preparing">Preparing</option>
                <option value="ready">Ready</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label small text-secondary mb-1">Date</label>
              <input type="date" id="filterDate" class="form-control">
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label small text-secondary mb-1">Search token / student</label>
              <input type="search" id="filterSearch" class="form-control" placeholder="e.g. A-104 or Rahul">
            </div>
            <div class="col-sm-6 col-lg-3 d-flex gap-2">
              <button class="btn btn-primary flex-fill" id="applyFilters"><i class="bi bi-funnel me-1"></i>Apply</button>
              <button class="btn btn-outline-secondary" id="clearFilters" title="Clear"><i class="bi bi-x-lg"></i></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Orders table -->
      <div class="table-card">
        <div class="table-responsive">
          <table class="table admin-table">
            <thead>
              <tr>
                <th>Order ID</th><th>Token</th><th>Student</th><th>Items</th><th>Amount</th>
                <th>Payment</th><th>Order Time</th><th>Status</th><th>Action</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr><td colspan="9" class="empty-mini">Loading orders…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="text-secondary small mt-2" id="ordersMeta"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin/orders.js"></script>
</body>
</html>
