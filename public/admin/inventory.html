<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory — Smart Canteen Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body data-layout="admin" data-page="inventory">
  <div id="adminSidebarMount"></div>

  <div class="admin-main">
    <div id="adminTopbarMount"></div>

    <main class="admin-content">
      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
          <div class="stat-card"><div class="ico i-teal"><i class="bi bi-box-seam"></i></div>
            <div><div class="label">Total Items</div><div class="value" id="invTotal">—</div></div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card"><div class="ico i-amber"><i class="bi bi-hourglass-split"></i></div>
            <div><div class="label">Low Stock</div><div class="value" id="invLow">—</div></div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card"><div class="ico i-red"><i class="bi bi-x-octagon"></i></div>
            <div><div class="label">Out of Stock</div><div class="value" id="invOut">—</div></div></div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card"><div class="ico i-blue"><i class="bi bi-arrow-repeat"></i></div>
            <div><div class="label">Auto-deduction</div><div class="value" style="font-size:1.05rem">On</div><div class="hint">orders update stock live</div></div></div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="table-card">
            <div class="table-responsive">
              <table class="table admin-table">
                <thead>
                  <tr><th>Food Item</th><th>Current Stock</th><th>Minimum Stock</th><th>Status</th><th>Last Updated</th><th style="text-align:right">Action</th></tr>
                </thead>
                <tbody id="invBody"><tr><td colspan="6" class="empty-mini">Loading inventory…</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card-panel">
            <div class="card-head"><h6><i class="bi bi-clock-history text-primary me-2"></i>Recent stock movements</h6></div>
            <div class="card-body-p" id="logList"><div class="empty-mini">Loading…</div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Stock update modal -->
  <div class="modal fade" id="stockModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="stockForm" novalidate style="border-radius:18px">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title">Update Stock</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="stockId">
          <p class="text-secondary mb-3" id="stockItemName">—</p>
          <div class="mb-3">
            <label class="form-label" for="stockValue">New stock quantity</label>
            <input type="number" class="form-control form-control-lg" id="stockValue" min="0" required>
            <div class="invalid-feedback">Enter 0 or more.</div>
          </div>
          <div class="mb-2">
            <label class="form-label" for="stockReason">Reason</label>
            <input type="text" class="form-control" id="stockReason" placeholder="e.g. Morning restock">
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="stockSave">Update Stock</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin/inventory.js"></script>
</body>
</html>
