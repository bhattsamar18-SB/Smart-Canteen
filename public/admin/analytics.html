<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales &amp; Analytics — Smart Canteen Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body data-layout="admin" data-page="analytics">
  <div id="adminSidebarMount"></div>

  <div class="admin-main">
    <div id="adminTopbarMount"></div>

    <main class="admin-content">
      <!-- Date filter -->
      <div class="card-panel mb-4">
        <div class="card-body-p">
          <div class="row g-3 align-items-end">
            <div class="col-sm-4 col-lg-3">
              <label class="form-label small text-secondary mb-1">From date</label>
              <input type="date" id="fromDate" class="form-control">
            </div>
            <div class="col-sm-4 col-lg-3">
              <label class="form-label small text-secondary mb-1">To date</label>
              <input type="date" id="toDate" class="form-control">
            </div>
            <div class="col-sm-4 col-lg-6 d-flex gap-2 flex-wrap">
              <button class="btn btn-primary" id="applyRange"><i class="bi bi-funnel me-1"></i>Apply</button>
              <button class="btn btn-outline-primary btn-sm quick-range" data-days="7">7 days</button>
              <button class="btn btn-outline-primary btn-sm quick-range" data-days="30">30 days</button>
              <button class="btn btn-outline-primary btn-sm quick-range" data-days="90">90 days</button>
            </div>
          </div>
        </div>
      </div>

      <!-- KPI cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-xl">
          <div class="stat-card"><div class="ico i-teal"><i class="bi bi-currency-rupee"></i></div>
            <div><div class="label">Today's Revenue</div><div class="value" id="kpiToday">—</div></div></div>
        </div>
        <div class="col-6 col-xl">
          <div class="stat-card"><div class="ico i-blue"><i class="bi bi-calendar-week"></i></div>
            <div><div class="label">Weekly Revenue</div><div class="value" id="kpiWeek">—</div></div></div>
        </div>
        <div class="col-6 col-xl">
          <div class="stat-card"><div class="ico i-amber"><i class="bi bi-calendar-month"></i></div>
            <div><div class="label">Monthly Revenue</div><div class="value" id="kpiMonth">—</div></div></div>
        </div>
        <div class="col-6 col-xl">
          <div class="stat-card"><div class="ico i-blue"><i class="bi bi-bag-check"></i></div>
            <div><div class="label">Total Orders</div><div class="value" id="kpiOrders">—</div></div></div>
        </div>
        <div class="col-6 col-xl">
          <div class="stat-card"><div class="ico i-red"><i class="bi bi-graph-up"></i></div>
            <div><div class="label">Avg Order Value</div><div class="value" id="kpiAvg">—</div></div></div>
        </div>
      </div>

      <!-- Charts -->
      <div class="row g-4 mb-4">
        <div class="col-lg-7">
          <div class="card-panel h-100">
            <div class="card-head"><h6>Daily Sales</h6><span class="text-secondary" style="font-size:.8rem">revenue (₹)</span></div>
            <div class="card-body-p"><div class="chart-box"><canvas id="salesChart"></canvas></div></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card-panel h-100">
            <div class="card-head"><h6>Orders Per Day</h6></div>
            <div class="card-body-p"><div class="chart-box"><canvas id="ordersChart"></canvas></div></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card-panel h-100">
            <div class="card-head"><h6>Popular Food Items</h6><span class="text-secondary" style="font-size:.8rem">by quantity sold</span></div>
            <div class="card-body-p"><div class="chart-box"><canvas id="popularChart"></canvas></div></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card-panel h-100">
            <div class="card-head"><h6>Revenue by Category</h6></div>
            <div class="card-body-p"><div class="chart-box"><canvas id="categoryChart"></canvas></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin/analytics.js"></script>
</body>
</html>
