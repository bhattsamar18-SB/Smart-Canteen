<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Smart Canteen Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body data-layout="admin" data-page="dashboard">
  <div id="adminSidebarMount"></div>

  <div class="admin-main">
    <div id="adminTopbarMount"></div>

    <main class="admin-content">
      <!-- Stat cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-xl-3">
          <div class="stat-card">
            <div class="ico i-teal"><i class="bi bi-bag-check"></i></div>
            <div><div class="label">Today's Orders</div><div class="value" id="statOrders">—</div><div class="hint">so far today</div></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="stat-card">
            <div class="ico i-amber"><i class="bi bi-currency-rupee"></i></div>
            <div><div class="label">Today's Revenue</div><div class="value" id="statRevenue">—</div><div class="hint">excluding cancelled</div></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="stat-card">
            <div class="ico i-blue"><i class="bi bi-hourglass-split"></i></div>
            <div><div class="label">Pending Orders</div><div class="value" id="statPending">—</div><div class="hint">awaiting completion</div></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="stat-card">
            <div class="ico i-red"><i class="bi bi-exclamation-triangle"></i></div>
            <div><div class="label">Low Stock Items</div><div class="value" id="statLow">—</div><div class="hint">need restocking</div></div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <!-- Recent orders -->
        <div class="col-lg-8">
          <div class="card-panel">
            <div class="card-head">
              <h6><i class="bi bi-receipt text-primary me-2"></i>Recent Orders</h6>
              <a href="/admin/orders" class="btn btn-sm btn-outline-primary">View all</a>
            </div>
            <div class="table-responsive">
              <table class="table admin-table">
                <thead>
                  <tr><th>Token</th><th>Student</th><th>Items</th><th>Amount</th><th>Time</th><th>Status</th></tr>
                </thead>
                <tbody id="recentOrders"><tr><td colspan="6" class="empty-mini">Loading…</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Low stock + quick links -->
        <div class="col-lg-4">
          <div class="card-panel mb-4">
            <div class="card-head">
              <h6><i class="bi bi-exclamation-circle text-danger me-2"></i>Low Stock</h6>
              <a href="/admin/inventory" class="btn btn-sm btn-outline-secondary">Manage</a>
            </div>
            <div class="card-body-p" id="lowStockList"><div class="empty-mini">Loading…</div></div>
          </div>

          <div class="card-panel">
            <div class="card-head"><h6><i class="bi bi-lightning-charge text-warning me-2"></i>Quick Actions</h6></div>
            <div class="card-body-p d-grid gap-2">
              <a href="/admin/orders" class="btn btn-primary"><i class="bi bi-receipt me-2"></i>Process Orders</a>
              <a href="/admin/menu" class="btn btn-outline-primary"><i class="bi bi-cup-hot me-2"></i>Add / Edit Menu Items</a>
              <a href="/admin/analytics" class="btn btn-outline-primary"><i class="bi bi-graph-up-arrow me-2"></i>View Sales Report</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin/dashboard.js"></script>
</body>
</html>
