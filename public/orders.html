<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders — Smart Canteen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top border-bottom py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <span class="brand-mark">🍽️</span>
        <span class="brand-text fw-bold fs-5 text-dark">Smart Canteen</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/menu">Menu</a></li>
          <li class="nav-item"><a class="nav-link active" href="/orders">My Orders</a></li>
          <li class="nav-item"><a class="nav-link" href="/#about">About</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span data-auth-link="name" class="fw-semibold text-primary" hidden></span>
          <a href="/admin" class="btn btn-sm btn-outline-secondary" data-auth-link="admin" hidden><i class="bi bi-speedometer2 me-1"></i>Admin</a>
          <a href="/login" class="btn btn-outline-primary" data-auth-link="login">Sign In</a>
          <button class="btn btn-outline-secondary btn-sm" data-auth-link="logout" hidden data-logout-btn>Logout</button>
          <button class="cart-btn desktop-cart" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" aria-label="Open cart">
            <i class="bi bi-bag"></i><span class="cart-count" hidden>0</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
      <div>
        <div class="eyebrow">History</div>
        <h2 class="mb-1">My Orders</h2>
        <p class="text-secondary mb-0">Every order you've placed at the campus canteen.</p>
      </div>
      <a href="/menu" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>New Order</a>
    </div>

    <div id="emptyState" class="empty-state" hidden>
      <div class="big">🍽️</div>
      <h5>No orders yet</h5>
      <p>Your delicious journey starts with your first order.</p>
      <a href="/menu" class="btn btn-primary">Browse the Menu</a>
    </div>

    <div class="d-flex flex-column gap-3" id="ordersList"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
